[workspace]
resolver = "2"
members = ["crates/fh1-formats", "crates/fh1setup", "crates/fh1-engine", "crates/fh1-world", "crates/fh1-audio", "crates/fh1-radio", "crates/fh1-net", "crates/fh1-shaders", "crates/fh1-render", "crates/fh1-ui", "crates/fh1-remaster", "crates/fh1-launcher"]
exclude = ["vendor/bevy_solarik", "vendor/bevy_pbr"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Vendored lzxd with fixes for XMemCompress streams (see vendor/lzxd/FH1_PATCHES.md).
[patch.crates-io]
lzxd = { path = "vendor/lzxd" }
# Vendored bevy_pbr 0.19.1 with directional shadow cascade caching (see vendor/bevy_pbr/FH1_PATCHES.md).
bevy_pbr = { path = "vendor/bevy_pbr" }
# Vendored wgpu-core 29.0.4: bind groups merged into a pass's usage scope once per pass (see vendor/wgpu-core/FH1_PATCHES.md).
wgpu-core = { path = "vendor/wgpu-core" }

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
