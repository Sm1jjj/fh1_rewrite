[package]
name = "fh1-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Release front end: installs FH1 Rewrite from the user's own disc(s) and launches the game"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
