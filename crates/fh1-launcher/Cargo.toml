[package]
name = "fh1-launcher"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Release front end: installs FH1 Rewrite from the user's own disc(s) and launches the game"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha2 = "0.11"
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma"] }

# Linux file dialogs through the desktop portal (no GTK to link); the path box works without one.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
eframe = { version = "0.35", default-features = false, features = ["x11", "wayland"] }
