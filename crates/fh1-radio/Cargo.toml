[package]
name = "fh1-radio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Forza Horizon (Xbox 360) in-game radio: station config, setup conversion, scheduler and mixer"

[dependencies]
anyhow = "1"
# Case-insensitive disc paths (Linux).
fh1-formats = { path = "../fh1-formats" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
cpal = { version = "0.17", optional = true }
# Shared output-device choice (`FH1_AUDIO_DEVICE`, follows the system default).
fh1-audio = { path = "../fh1-audio", default-features = false, optional = true }

[features]
default = ["output"]
# Live playback through the default audio device (the mixer itself is device-independent).
output = ["dep:cpal", "dep:fh1-audio", "fh1-audio/output"]

[dev-dependencies]
# Only for the examples' WAV output.
fh1-audio = { path = "../fh1-audio", default-features = false }
